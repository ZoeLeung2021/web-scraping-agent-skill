id: aelia_duty_free_lima_airport_scraper_flow
namespace: dev.scrapers
description: |
  Aelia Duty Free (Lima's Jorge Chávez International Airport marketplace) ETL Pipeline.
  Step 1 (Bronze): Headless Selenium scraper runs in Docker, uploads raw JSON to Databricks Unity Catalog Volume.
  Step 2 (Silver): PySpark cleaning job runs on Databricks, enforces schema and writes to Delta.

  DEPLOY TARGET: copy this file to
  GTR_Pricing/kestra_flows/aelia_duty_free_lima_airport_flow.yaml once the
  scraper and cleaner are deployed there too.

  NOTE: this site (marketplace.lima-airport.com) is the online storefront
  operated by Lima Airport Partners S.R.L. (LAP), but every scraped product
  card says "Vendido por: Aelia Duty Free" — the RETAILER naming choice in
  clean_aelia_duty_free_lima_airport.py is flagged for the data owner's
  confirmation, see that file's module docstring.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: run_aelia_duty_free_lima_airport_scraper_bronze
    type: io.kestra.plugin.scripts.python.Commands
    description: "BRONZE: Headless scraper lands raw JSON into Databricks Volume."
    runner: DOCKER
    docker:
      image: etl-scrapers:latest
      pullPolicy: NEVER
    env:
      DATABRICKS_HOST: "{{ envs.databricks_host }}"
      DATABRICKS_TOKEN: "{{ envs.databricks_token }}"
    commands:
      - python /app/aelia_duty_free_lima_airport_scraper.py

  - id: run_pyspark_silver
    type: io.kestra.core.tasks.flows.Subflow
    description: "SILVER: Routed through the shared dispatcher so only one Silver MERGE job runs against Databricks at a time across every site."
    namespace: dev.scrapers
    flowId: silver_clean_dispatcher
    inputs:
      script_name: clean_aelia_duty_free_lima_airport
    wait: true
    transmitFailed: true

errors:
  - id: log_failure_alert
    type: io.kestra.core.tasks.log.Log
    message: "CRITICAL ⚠️ Aelia Duty Free (Lima Airport) scraper ETL failed! Check execution logs for details."
  - id: slack_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ envs.slack_webhook_url }}"
    payload: |
      {
        "channel": "#data-engineering-alerts",
        "text": "URGENT ⚠️ Aelia Duty Free (Lima Airport) ETL failed.\n• Failed step: {{ flow.id }}\n• Check Kestra UI logs for full error.\n\nIf Velocity Anomaly → New Execution to re-scrape.\nIf code error → fix script then Replay from failed task."
      }
