id: gonsalves_liquors_scraper_flow
namespace: dev.scrapers
description: |
  Gonsalves Liquors Ltd. (Saint Vincent and the Grenadines) ETL Pipeline.
  Step 1 (Bronze): downloads and parses the retailer's published PDF
  price list (requests + pdfplumber, no Selenium needed - see scraper
  module docstring for why), uploads raw JSON to Databricks Unity
  Catalog Volume.
  Step 2 (Silver): PySpark cleaning job runs on Databricks, enforces
  schema and writes to Delta.

  NOTE: clean_gonsalves_liquors.py ships with Domestic_Tax left null -
  Saint Vincent and the Grenadines' real alcohol excise/duty tax rate(s)
  have not been researched or proposed to the user yet. Do not deploy
  silently assuming that's resolved.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: run_gonsalves_liquors_scraper_bronze
    type: io.kestra.plugin.scripts.python.Commands
    description: "BRONZE: fetches the price-list PDF over plain HTTP and parses it, lands raw JSON into Databricks Volume."
    runner: DOCKER
    docker:
      image: etl-scrapers:latest
      pullPolicy: NEVER
    env:
      DATABRICKS_HOST: "{{ envs.databricks_host }}"
      DATABRICKS_TOKEN: "{{ envs.databricks_token }}"
    commands:
      - python /app/gonsalves_liquors_scraper.py

  - id: run_pyspark_silver
    type: io.kestra.core.tasks.flows.Subflow
    description: "SILVER: Routed through the shared dispatcher so only one Silver MERGE job runs against Databricks at a time across every site."
    namespace: dev.scrapers
    flowId: silver_clean_dispatcher
    inputs:
      script_name: clean_gonsalves_liquors
    wait: true
    transmitFailed: true

errors:
  - id: log_failure_alert
    type: io.kestra.core.tasks.log.Log
    message: "CRITICAL ⚠️ Gonsalves Liquors scraper ETL failed! Check execution logs for details."
  - id: slack_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ envs.slack_webhook_url }}"
    payload: |
      {
        "channel": "#data-engineering-alerts",
        "text": "URGENT ⚠️ Gonsalves Liquors ETL failed.\n• Failed step: {{ flow.id }}\n• Check Kestra UI logs for full error.\n\nIf the retailer changed their PDF's filename or layout → inspect the PDF manually and update gonsalves_liquors_scraper.py's parsing regex.\nIf a transient error → New Execution to re-scrape.\nIf code error → fix script then Replay from failed task."
      }
