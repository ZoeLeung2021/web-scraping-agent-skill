id: spiritsandwine_latvia_scraper_flow
namespace: dev.scrapers
description: |
  Spirits & Wine (Latvia domestic online liquor retailer, operated by
  SIA "Riga Spirits & Wine Outlet") ETL Pipeline.
  Step 1 (Bronze): Headless Selenium scraper runs in Docker, uploads raw JSON to Databricks Unity Catalog Volume.
  Step 2 (Silver): PySpark cleaning job runs on Databricks, enforces schema and writes to Delta.

  DEPLOY TARGET: copy this file to
  GTR_Pricing/kestra_flows/spiritsandwine_latvia_flow.yaml once the
  scraper and cleaner are deployed there too.

  NOTE: clean_spiritsandwine_latvia.py computes a real per-product
  Domestic_Tax by reusing SuperAlko Latvia's user-confirmed VID excise
  rates, but EXTENDS the category->band mapping to cover Type categories
  SuperAlko never had (port/sherry, vermouth, sparkling wine, mixed-ABV
  "Mini" miniatures) -- see that file's module docstring. That extension
  has NOT been separately signed off by the user for this site. Do not
  deploy silently assuming that's resolved.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: run_spiritsandwine_latvia_scraper_bronze
    type: io.kestra.plugin.scripts.python.Commands
    description: "BRONZE: Headless scraper lands raw JSON into Databricks Volume."
    runner: DOCKER
    docker:
      image: etl-scrapers:latest
      pullPolicy: NEVER
    env:
      DATABRICKS_HOST: "{{ envs.databricks_host }}"
      DATABRICKS_TOKEN: "{{ envs.databricks_token }}"
    commands:
      - python /app/spiritsandwine_latvia_scraper.py

  - id: run_pyspark_silver
    type: io.kestra.core.tasks.flows.Subflow
    description: "SILVER: Routed through the shared dispatcher so only one Silver MERGE job runs against Databricks at a time across every site."
    namespace: dev.scrapers
    flowId: silver_clean_dispatcher
    inputs:
      script_name: clean_spiritsandwine_latvia
    wait: true
    transmitFailed: true

errors:
  - id: log_failure_alert
    type: io.kestra.core.tasks.log.Log
    message: "CRITICAL ⚠️ Spirits & Wine (Latvia) scraper ETL failed! Check execution logs for details."
  - id: slack_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ envs.slack_webhook_url }}"
    payload: |
      {
        "channel": "#data-engineering-alerts",
        "text": "URGENT ⚠️ Spirits & Wine (Latvia) ETL failed.\n• Failed step: {{ flow.id }}\n• Check Kestra UI logs for full error.\n\nIf Velocity Anomaly → New Execution to re-scrape.\nIf code error → fix script then Replay from failed task."
      }
